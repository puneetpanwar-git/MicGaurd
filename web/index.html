<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mic Guard</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif;color:#fff;background:#000;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:background .15s;-webkit-tap-highlight-color:transparent;user-select:none}
  body.idle{background:#000}
  body.live{background:#0a8f2f}
  body.muted{background:#c0141c}
  #label{font-size:14vw;font-weight:800;letter-spacing:.04em}
  #sub{font-size:4.5vw;opacity:.85;margin-top:1rem;padding:0 1rem}
  .bar{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:12px}
  button{font-size:1rem;padding:.8rem 1.2rem;border-radius:12px;border:1px solid #fff6;background:#0006;color:#fff}
</style>
</head>
<body class="idle">
  <div id="label">NO CALL</div>
  <div id="sub">Tap Connect to pair with your laptop</div>
  <div class="bar">
    <button id="connect">Connect</button>
    <button id="demo">Demo</button>
  </div>
<script>
const SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const CHAR    = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const label = document.getElementById('label'), sub = document.getElementById('sub');
let lastState = 0, cmdChar = null, demo = false;

function show(v){
  lastState = v;
  document.body.className = ['idle','live','muted'][v];
  label.textContent = ['NO CALL','MIC LIVE','MUTED'][v];
  sub.textContent = ['Waiting for a call…','You are being heard · tap to mute','Safe to talk privately · tap to unmute'][v];
  if (v === 1 && navigator.vibrate) navigator.vibrate([200,100,200]);
}

async function keepAwake(){ try { await navigator.wakeLock.request('screen'); } catch(e){} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

async function connect(){
  if (window.self !== window.top){ sub.textContent = 'Bluetooth is blocked inside a preview/frame. Open this page directly in Chrome over HTTPS.'; return; }
  if (!navigator.bluetooth){ sub.textContent = 'Web Bluetooth needs Chrome on Android. Not supported on iPhone.'; return; }
  try{
    const dev = await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}]});
    dev.addEventListener('gattserverdisconnected', () => { cmdChar = null; sub.textContent = 'Disconnected. Reconnecting…'; setTimeout(() => attach(dev), 1500); });
    await attach(dev);
    keepAwake();
  }catch(e){ sub.textContent = 'Could not connect: ' + e.message; }
}

async function attach(dev){
  try{
    const server = await dev.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE);
    const ch = await svc.getCharacteristic(CHAR);
    cmdChar = ch;
    show((await ch.readValue()).getUint8(0));
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged', e => { if (!demo) show(e.target.value.getUint8(0)); });
  }catch(e){ sub.textContent = 'Retrying… ' + e.message; setTimeout(() => attach(dev), 3000); }
}

// Tap anywhere (outside the buttons) during a call -> toggle laptop mic
document.body.addEventListener('click', async e => {
  if (e.target.closest('.bar')) return;
  if (demo) { show((lastState + 1) % 3); return; }
  if (cmdChar && lastState !== 0){
    try { await cmdChar.writeValue(new Uint8Array([1])); if (navigator.vibrate) navigator.vibrate(60); }
    catch(err){ sub.textContent = 'Could not send: ' + err.message; }
  }
});

document.getElementById('connect').onclick = connect;
document.getElementById('demo').onclick = () => { demo = !demo; if (demo) { show(1); sub.textContent = 'DEMO · tap to cycle · press Demo again to exit'; } else { show(0); } keepAwake(); };
</script>
</body>
</html>
